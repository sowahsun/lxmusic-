name: Upstream Sync & JS Index Builder

permissions:
  contents: write

on:
  schedule:
    - cron: "0 6 * * *" # 每天北京时间 14:00 (UTC 时间 6:00) 运行一次
  workflow_dispatch: # 允许手动点击触发

jobs:
  sync_and_index:
    name: Sync upstream & Build JS index
    runs-on: ubuntu-latest

    steps:
      # Step 1: 检出你的仓库代码
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 拉取完整 Git 历史用于获取文件提交时间

      # Step 2: 配置 Git
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

      # Step 3: N9G9 同款强力对齐方案 (解决自动修改 README 导致的合并冲突)
      - name: Hard Sync with Upstream
        run: |
          echo "🟠 备份当前工作流文件..."
          mkdir -p ../wf_backup && cp -r .github/workflows/* ../wf_backup/ 2>/dev/null || true
          
          echo "🟠 强力拉取上游仓库并重置..."
          git remote add upstream https://github.com/guoyue2010/lxmusic-.git
          git fetch upstream main
          git checkout main && git reset --hard upstream/main
          
          echo "🟠 恢复工作流文件..."
          mkdir -p .github/workflows && cp -r ../wf_backup/* .github/workflows/ 2>/dev/null || true

      # Step 3.5: 检测并补全上游 Release (使用 7z 修复中文乱码)
      - name: Auto-Extract Upstream Release
        run: |
          echo "🟠 [检测] 正在检测 guoyue2010/lxmusic- 最新的 Release 状态..."
          UPSTREAM_REPO="guoyue2010/lxmusic-"
          RELEASE_JSON=$(curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/$UPSTREAM_REPO/releases/latest")
          
          TAG_NAME=$(echo "$RELEASE_JSON" | jq -r '.tag_name // empty')
          
          if [[ -z "$TAG_NAME" ]] || [[ "$TAG_NAME" == "null" ]]; then
            echo "❌ 未找到 Release 标签，跳过提取。"
          else
            echo "✅ 发现最新 Release 版本: $TAG_NAME"
            
            TAG_LOWER=$(echo "$TAG_NAME" | tr '[:upper:]' '[:lower:]')
            if [[ -d "$TAG_NAME" ]] || [[ -d "$TAG_LOWER" ]] || [[ -f "$TAG_NAME.js" ]]; then
              echo "✅ 上游仓库主分支已包含对应的实体文件，无需介入，直接使用！"
            else
              echo "🟠 上游并未提交最新 Release 的实体文件，开始自动下载并解压补全..."
              
              mkdir -p "$TAG_NAME"
              
              # 提取 JS 和 ZIP 的下载直链
              JS_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[]? | select(.name | endswith(".js")) | .browser_download_url' | head -n 1)
              ZIP_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[]? | select(.name | endswith(".zip")) | .browser_download_url' | head -n 1)
              
              if [[ -n "$JS_URL" ]] && [[ "$JS_URL" != "null" ]]; then
                echo "⬇️ 发现 .js 单文件，直接下载..."
                curl -sL -o "$TAG_NAME/$(basename "$JS_URL")" "$JS_URL"
              elif [[ -n "$ZIP_URL" ]] && [[ "$ZIP_URL" != "null" ]]; then
                echo "⬇️ 发现 .zip 压缩包，开始下载并解压..."
                curl -sL -o temp_release.zip "$ZIP_URL"
                
                # 使用 7z 替代 unzip，完美解决中文字符乱码导致解压崩溃的问题
                7z x temp_release.zip -o"$TAG_NAME/" -y
                rm -f temp_release.zip
                
                # 扒掉解压后可能存在的多余外层嵌套文件夹
                cd "$TAG_NAME"
                if [[ $(find . -maxdepth 1 -mindepth 1 | wc -l) -eq 1 ]] && [[ -d "$(find . -maxdepth 1 -mindepth 1 | head -n 1)" ]]; then
                  INNER_DIR=$(find . -maxdepth 1 -mindepth 1 | head -n 1)
                  echo "🔧 发现嵌套文件夹 $INNER_DIR，正在提取内容..."
                  mv "$INNER_DIR"/* ./ 2>/dev/null || true
                  rmdir "$INNER_DIR"
                fi
                cd ..
              else
                echo "⬇️ 没有检测到单独的资产附件，自动下载 Source code (zip)..."
                ZIPBALL_URL=$(echo "$RELEASE_JSON" | jq -r '.zipball_url')
                curl -sL -o temp_source.zip "$ZIPBALL_URL"
                
                # 同理，使用 7z 解压源码包
                7z x temp_source.zip -o"$TAG_NAME/" -y
                rm -f temp_source.zip
                
                cd "$TAG_NAME"
                if [[ $(find . -maxdepth 1 -mindepth 1 | wc -l) -eq 1 ]] && [[ -d "$(find . -maxdepth 1 -mindepth 1 | head -n 1)" ]]; then
                  INNER_DIR=$(find . -maxdepth 1 -mindepth 1 | head -n 1)
                  mv "$INNER_DIR"/* ./ 2>/dev/null || true
                  rmdir "$INNER_DIR"
                fi
                cd ..
              fi
              
              echo "✅ Release 文件已成功提取至 $TAG_NAME 目录中！"
              # 关键动作：立刻将补全的文件夹推入 Git 暂存区，以便后续步骤扫描
              git add "$TAG_NAME"

              # 关键修复：把 Release 的发布时间和目录名传给后续步骤，用于修正 git log 拿不到时间的问题
              UPSTREAM_PUBLISHED_AT=$(echo "$RELEASE_JSON" | jq -r '.published_at // .created_at // empty')
              echo "UPSTREAM_EXTRACTED_DIR=$TAG_NAME" >> "$GITHUB_ENV"
              echo "UPSTREAM_PUBLISHED_AT=$UPSTREAM_PUBLISHED_AT" >> "$GITHUB_ENV"
              echo "🕒 已记录 Release 发布时间: $UPSTREAM_PUBLISHED_AT"
            fi
          fi

      # Step 4: 扫描所有 JS 文件并生成 list.json（融合 Release 与自定义直链）
      - name: Scan JS files & Generate list.json
        env:
          REPO: ${{ github.repository }}
        run: |
          echo "🟠 [扫描] 正在扫描仓库中的所有 JS 音源文件..."
          rm -f js_files_raw.txt

          # 使用 git ls-files 获取所有跟踪的 .js 文件，末尾增加标识 LOCAL_REPO
          while IFS= read -r -d '' filepath; do
            if [[ "$filepath" == *.js ]] && [[ ! "$filepath" =~ ^\.github/ ]]; then
              # 1) 优先取 Git 提交时间
              committime=$(git log -1 --format=%ci -- "$filepath" 2>/dev/null)

              # 2) 若为空（说明是刚刚 Release 补全、尚未提交的新文件），使用 Release 发布时间
              if [[ -z "$committime" ]] && [[ -n "$UPSTREAM_EXTRACTED_DIR" ]] && [[ -n "$UPSTREAM_PUBLISHED_AT" ]] && [[ "$filepath" == "${UPSTREAM_EXTRACTED_DIR}/"* ]]; then
                committime=$(date -d "$UPSTREAM_PUBLISHED_AT" '+%Y-%m-%d %H:%M:%S %z' 2>/dev/null)
                echo "🕒 [修复时间] $filepath -> $committime (来自 Release published_at)"
              fi

              # 3) 兜底：使用文件系统 mtime
              if [[ -z "$committime" ]]; then
                committime=$(date -r "$filepath" '+%Y-%m-%d %H:%M:%S %z' 2>/dev/null || date '+%Y-%m-%d %H:%M:%S %z')
              fi

              # 获取文件大小
              filesize=$(stat -c%s "$filepath" 2>/dev/null || echo "0")
              echo "$filepath|$committime|$filesize|LOCAL_REPO" >> js_files_raw.txt
            fi
          done < <(git ls-files -z)

          echo "🟠 正在请求 Macrohard0001 最新 Release 获取未压缩 JS..."
          # 通过带 Token 的 API 获取最新 release，突破匿名 API 请求次数限制
          release_json=$(curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/Macrohard0001/lx-ikun-music-sources/releases/latest)
          
          # 打印 API 请求状态检查结果
          echo "API 请求状态检查："
          echo "$release_json" | jq -r '.message // "✅ 成功获取 Release 数据"'
          
          # 提取 Release 的标签名作为版本/分类
          tag_name=$(echo "$release_json" | jq -r '.tag_name // "unknown_version"')
          
          # 遍历 assets 中以 .js 结尾的文件
          echo "$release_json" | jq -c '.assets[]? | select(.name | endswith(".js"))' | while read -r asset; do
            asset_name=$(echo "$asset" | jq -r '.name')
            asset_time=$(echo "$asset" | jq -r '.updated_at')
            asset_size=$(echo "$asset" | jq -r '.size')
            asset_url=$(echo "$asset" | jq -r '.browser_download_url')
            
            # 加上“优质_”前缀，以通过 PHP 端 $is_good 的检测机制
            mock_filepath="Macrohard0001/优质_$tag_name/$asset_name"
            
            # 直接将下载直链写在第4个字段
            echo "$mock_filepath|$asset_time|$asset_size|$asset_url" >> js_files_raw.txt
          done

          echo "🟠 正在格式化为 JSON 并替换直链..."
          # 利用 jq 处理，如果是 LOCAL_REPO 则拼接为当前仓库 ($repo) 的直链，否则使用源直链。去掉了 -c 参数实现自动换行。
          # 新增逻辑：如果文件没有专属分类目录（路径层级 <= 2），则默认强行划入“优质”分类。
          if [ -f js_files_raw.txt ]; then
            cat js_files_raw.txt | jq -R -s --arg repo "$REPO" '
              split("\n") | map(select(length > 0)) | map(split("|") | {
                name: (.[0] | split("/") | last),
                path: .[0],
                version: (.[0] | split("/")[0]),
                category: (if (.[0] | split("/") | length) <= 2 then "优质" else (.[0] | split("/")[1]) end),
                time: .[1],
                size: (.[2] | tonumber),
                url: (if .[3] == "LOCAL_REPO" then ("https://raw.githubusercontent.com/" + $repo + "/main/" + (.[0] | split("/") | map(gsub(" "; "%20") | gsub("\\["; "%5B") | gsub("\\]"; "%5D") | gsub("\\("; "%28") | gsub("\\)"; "%29")) | join("/"))) else .[3] end)
              })
            ' > list.json
          else
            echo "[]" > list.json
          fi

          echo "✅ list.json 生成完成，共 $(cat list.json | jq 'length') 条记录"
          rm -f js_files_raw.txt

      # Step 5: 生成美观的 README.md
      - name: Generate README.md
        env:
          REPO: ${{ github.repository }}
        run: |
          echo "🟠 [排版] 正在生成 README.md..."
          cat << 'PYEOF' > build_readme.py
          import json
          import os

          REPO = os.environ.get("REPO", "sowahsun/lxmusic-")

          # 读取 list.json
          try:
              with open("list.json", "r", encoding="utf-8") as f:
                  items = json.load(f)
          except Exception as e:
              print("读取 list.json 失败:", e)
              items = []

          # 按版本和分类分组
          groups = {}
          # 记录每个版本的最新时间，用于排序
          ver_max_times = {}
          
          for item in items:
              ver = item.get("version", "其他")
              cat = item.get("category", "其他")
              t = item.get("time", "")
              
              # 记录该版本的最大时间
              if ver not in ver_max_times or t > ver_max_times[ver]:
                  ver_max_times[ver] = t
              
              if ver not in groups:
                  groups[ver] = {}
              if cat not in groups[ver]:
                  groups[ver][cat] = []
              groups[ver][cat].append(item)

          # 分类排序权重
          cat_order = {
              "推荐": 0,
              "第一批次": 1,
              "第二批次": 2,
              "第三批次": 3,
              "优质-支持四平台FLAC": 4,
              "良好-支持至少两平台FLAC": 5,
              "一般-支持单平台FLAC或多平台320k": 6,
              "较差-支持单平台320k或多平台128k": 7,
              "其他": 8,
              "未测试": 9,
          }

          def sort_cat(cat):
              return cat_order.get(cat, 99)

          # 版本排序：按最新文件时间降序
          sorted_versions = sorted(groups.keys(), key=lambda v: ver_max_times.get(v, ""), reverse=True)

          # 构建 Markdown
          md = "# 🎵 LX Music 音源索引\n\n"
          md += "> ⚡️ **全自动聚合更新**，为您整理最新、最全的洛雪音乐音源。\n\n"
          md += "## 📑 目录\n\n"

          # 目录
          for ver in sorted_versions:
              md += f"- [{ver}](#{ver.lower()})\n"
          md += "\n"

          # 统计
          total = len(items)
          md += f"**当前收录音源总数：{total} 个**\n\n"
          md += "---\n\n"

          # 各版本详情
          for ver in sorted_versions:
              md += f"## {ver}\n\n"
              categories = groups[ver]
              sorted_cats = sorted(categories.keys(), key=sort_cat)

              for cat in sorted_cats:
                  cat_items = categories[cat]
                  # 按时间降序
                  cat_items.sort(key=lambda x: x.get("time", ""), reverse=True)

                  md += f"### 📂 {cat} ({len(cat_items)} 个)\n\n"
                  md += "| 音源名称 | 更新时间 | 大小 | 下载直链 |\n"
                  md += "| :--- | :--- | :--- | :--- |\n"

                  for item in cat_items:
                      name = item.get("name", "Unknown")
                      time_str = item.get("time", "")[:10]
                      size = item.get("size", 0)
                      # 格式化大小
                      if size > 1048576:
                          size_str = f"{size / 1048576:.1f} MB"
                      elif size > 1024:
                          size_str = f"{size / 1024:.1f} KB"
                      else:
                          size_str = f"{size} B"
                      url = item.get("url", "#")
                      md += f"| **{name}** | `{time_str}` | {size_str} | [📥 下载]({url}) |\n"

                  md += "\n"

              md += "---\n\n"

          # 页脚
          md += "## 🙏 声明与说明\n\n"
          md += "- 🚫 **免责声明**：本项目仅作技术分享，所有音源版权归原作者，严禁商业用途！\n"
          md += "- 🔗 **数据来源**：全自动同步自上游核心仓库 [guoyue2010/lxmusic-](https://github.com/guoyue2010/lxmusic-) 及核心维护者发布源 [Macrohard0001](https://github.com/Macrohard0001/lx-ikun-music-sources)。\n"
          md += "- 📅 **最后更新**：由 GitHub Actions 自动生成。\n"

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(md)

          print("✅ README.md 生成完成")
          PYEOF

          python3 build_readme.py
          rm -f build_readme.py

      # Step 6: 强制提交更改 (配合重置使用 Force Push)
      - name: Commit & Push
        run: |
          # 包含在 Step 3.5 中提前 git add 到暂存区的 Release 补全文件也会一并被提交
          git add .github/workflows/ list.json README.md
          if git diff --cached --quiet; then
            echo "✅ 没有变更，无需提交"
          else
            git commit -m "Auto: Update JS index & README [$(date +%Y-%m-%d)]"
            # 因为我们在 Step 3 重置了历史，这里必须使用 --force 强制推送到你自己的仓库
            git push origin main --force
            echo "✅ 已提交并强制更新主分支"
          fi
